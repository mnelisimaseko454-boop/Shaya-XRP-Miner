<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shaya XRP Miner</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- ONCLICKA BOOST - ID 472444 -->
<script src="https://js.onclckvd.com/in-stream-ad-admanager/tma.js"></script>
<script>
  window.initCdTma?.({ id: '472444' }).then(show => window.show = show).catch(e => console.log('OnclickA:', e));
</script>
<style>
  body{background:#0a0a1a;color:#fff;font-family:Arial;text-align:center;padding:20px;margin:0}
  .card{background:#1a1a2e;border-radius:20px;padding:20px;margin:10px 0}
  .big{font-size:42px;font-weight:bold;color:#ffd700}
  button{width:100%;padding:16px;border:none;border-radius:12px;font-size:18px;font-weight:bold;margin:8px 0;cursor:pointer}
  .mine{background:#ffd700;color:#000}.boost{background:#00d4ff;color:#000}.offer{background:#ff00aa;color:#fff}.claim{background:#00ff88;color:#000}
  input{width:100%;padding:12px;border-radius:10px;border:none;margin:8px 0;box-sizing:border-box}
</style>
</head>
<body>
<h1>⛏️ Shaya XRP Miner</h1>
<div class="card">
  <div>👤 <span id="username">Loading...</span></div>
  <div>💎 Diamonds</div>
  <div class="big" id="diamonds">0</div>
  <div>XRP: <span id="xrp">0.0000</span> | 1000 💎 = 1 XRP</div>
  <div id="status" style="font-size:13px;color:#aaa;margin-top:8px;"></div>
</div>
<div class="card">
  <button class="mine" onclick="doMine()">⛏️ MINE +1 💎</button>
  <button class="boost" onclick="watchBoost()">🎬 BOOST +2 💎 (Watch Ad)</button>
  <button class="offer" onclick="openOfferWall()">🎁 OPEN OFFERS (50-500 💎)</button>
  <input id="wallet" placeholder="Your XRP Wallet Address (for Claim)" />
  <button class="claim" onclick="doClaim()">💰 CLAIM XRP</button>
</div>
<p style="font-size:12px;color:#666;">Giga Offerwall • OnclickA Ads • Supabase Saved</p>

<script>
let diamonds = 0;
let userId = 0;
let username = 'guest';
if (window.Telegram?.WebApp) {
  Telegram.WebApp.ready();
  const u = Telegram.WebApp.initDataUnsafe?.user;
  if (u) { userId = u.id; username = u.username || u.first_name || 'user'; }
}
if (!userId) { userId = Math.floor(Math.random()*1000000000); username = 'test_' + userId; }
document.getElementById('username').innerText = '@' + username;

async function loadBalance(){
  try{
    const r = await fetch('/api/user/' + userId);
    const d = await r.json();
    diamonds = d.diamonds || 0;
    updateUI();
  }catch(e){ updateUI(); }
}
function updateUI(){
  document.getElementById('diamonds').innerText = diamonds;
  document.getElementById('xrp').innerText = (diamonds/1000).toFixed(4);
}
async function addDiamonds(amount, source, rewardId){
  try{
    const r = await fetch('/api/add-diamonds', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ userId, username, amount, source, rewardId })
    });
    const d = await r.json();
    if(d.success) diamonds = d.newBalance;
    updateUI();
    return d.success;
  }catch(e){ diamonds += amount; updateUI(); return true; }
}
async function doMine(){
  await addDiamonds(1, 'mine');
  document.getElementById('status').innerText = '+1 💎 Mined! Saved to Supabase';
}
async function watchBoost(){
  document.getElementById('status').innerText = 'Loading Ad...';
  try{
    if(!window.show) throw new Error('Ad not ready');
    await window.show();
    await addDiamonds(2, 'boost');
    document.getElementById('status').innerText = '+2 💎 Boost Rewarded!';
  }catch(e){
    document.getElementById('status').innerText = 'No ad right now. Try again in 30 sec.';
  }
}
async function doClaim(){
  const wallet = document.getElementById('wallet').value.trim();
  if(!wallet) return alert('Enter your XRP wallet address first');
  if(diamonds < 1000) return alert('Need 1000 💎 to claim. You have ' + diamonds);
  const r = await fetch('/api/claim', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ userId, username, wallet }) });
  const d = await r.json();
  if(d.success){ diamonds = 0; updateUI(); alert('Claim sent! ' + d.xrp.toFixed(4) + ' XRP pending. Admin will pay to ' + wallet); }
  else alert('Claim failed: ' + d.error);
}
loadBalance();

// --- GIGA OFFERWALL - PROJECT 9127 ---
document.addEventListener('DOMContentLoaded', function(){
  const s = document.createElement('script');
  s.src = 'https://wall.giga.pub/api/v1/loader.js?projectId=9127';
  s.async = true; document.head.appendChild(s);
});
(window.loadGigaSDKCallbacks || (window.loadGigaSDKCallbacks = [])).push(() => {
  window.loadOfferWallSDK({ projectId: '9127' }).then(sdk => {
    window.gigaOfferWallSDK = sdk;
    sdk.on('rewardClaim', async (data) => {
      const ok = await addDiamonds(Number(data.amount||0), 'offerwall', String(data.rewardId));
      if(ok){ try{ sdk.confirmReward(data.rewardId, data.hash); }catch(e){} alert('+' + data.amount + ' 💎 Offer Completed!'); }
    });
  }).catch(e => console.log('Giga:', e));
});
function openOfferWall(){
  if(window.gigaOfferWallSDK) window.gigaOfferWallSDK.open();
  else alert('Offers loading... wait 5 sec and try again');
}
</script>
</body>
</html>
