<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shaya XRP Miner</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://js.onclckvd.com/in-stream-ad-admanager/tma.js"></script>
<script>window.initCdTma?.({id:'472444'}).then(s=>window.show=s).catch(e=>console.log(e));</script>
<style>
body{background:#1a1a2e;color:#fff;font-family:Arial;margin:0;padding:16px}
.card{background:#2a2a3e;border-radius:16px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:8px;margin:8px 0}.row button{flex:1}
button{background:#3a3a55;color:#fff;border:none;padding:15px;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer}
button.full{width:100%;margin:8px 0}.gold{background:#ffd700;color:#000}
button:disabled{opacity:0.4;cursor:not-allowed}
.big{font-size:28px}.small{font-size:13px;color:#aaa}
input{width:100%;padding:12px;border-radius:10px;border:none;box-sizing:border-box;margin:8px 0}
</style></head><body>
<h2 style="text-align:center">⛏️ Shaya XRP Miner</h2>
<div class="card">
<div>👤 DASHBOARD</div><br>
<div>⬜ Available: <span id="diamonds">300</span> 💎</div>
<div>⬜ Payment: 0 💎</div>
<div>⬜ Payed out: <span id="xrp">0.00</span> XRP</div>
<div>1 XRP ~ 1.0636 $ | 1000 💎 = 1 XRP</div>
<div>⚡ Energy: <span id="energy">100</span> / 100</div>
<div>👑 VIP: FREE | Min Withdraw: 2000 💎</div>
<div class="small" id="status"></div>
</div>

<div class="row">
<button onclick="watchBoost()">🔥 Boost</button>
<button onclick="alert('⚡ Factory: Upgrade in Shop soon')">⚡ Factory</button>
<button onclick="alert('🏪 Shop coming soon')">🏪 Shop</button>
</div>
<div class="row">
<button onclick="openOfferWall()">💎 Add</button>
<button onclick="doClaim()">📩 Withdraw</button>
</div>
<button class="full" onclick="alert('👑 VIP: FREE - Active!')">👑 VIP</button>
<button class="full" onclick="alert('Share https://t.me/ShayaXRPMinerBot')">👥 Invite friends</button>
<div class="row">
<button onclick="claimBonus()">🎁 Bonus</button>
<button onclick="openOfferWall()">✨ Extra</button>
</div>
<button id="mineBtn" class="full gold" onclick="doMine()">⛏️ MINE +1 💎</button>
<input id="wallet" placeholder="Your XRP Wallet for Withdraw">
<div class="small" style="text-align:center">Ads + Offers only work inside this Mini App</div>

<script>
let diamonds=300, energy=100, userId=0, username='guest';
if(window.Telegram?.WebApp){Telegram.WebApp.ready();const u=Telegram.WebApp.initDataUnsafe?.user;if(u){userId=u.id;username=u.username||u.first_name||'user';}}
if(!userId){userId=Math.floor(Math.random()*1000000000);username='test_'+userId;}

async function loadBalance(){
  try{
    const r=await fetch('/api/user/'+userId);const d=await r.json();
    diamonds=d.diamonds||0; energy=d.energy ?? 100; updateUI();
  }catch(e){updateUI();}
}
function updateUI(){
  document.getElementById('diamonds').innerText=diamonds;
  document.getElementById('xrp').innerText=(diamonds/1000).toFixed(2);
  document.getElementById('energy').innerText=energy;
  const mineBtn=document.getElementById('mineBtn');
  if(mineBtn){
    mineBtn.disabled = energy <= 0;
    mineBtn.innerText = energy <= 0 ? '⛏️ NO ENERGY - Watch Boost!' : '⛏️ MINE +1 💎';
  }
}
async function addDiamonds(amount,source,rewardId){
  try{
    const r=await fetch('/api/add-diamonds',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId,username,amount,source,rewardId})});
    const d=await r.json();
    if(d.success){diamonds=d.newBalance; if(d.newEnergy!==undefined) energy=d.newEnergy;}
    updateUI(); return d.success;
  }catch(e){diamonds+=amount;updateUI();return true;}
}
async function doMine(){
  if(window._mining) return;
  window._mining=true; setTimeout(()=>window._mining=false, 3000);
  try{
    const r=await fetch('/api/mine',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId,username})});
    const d=await r.json();
    if(d.success){diamonds=d.diamonds; energy=d.energy; document.getElementById('status').innerText='+1 💎 Mined! Energy: '+energy;}
    else {document.getElementById('status').innerText=d.error; if(d.energy!==undefined) energy=d.energy;}
    updateUI();
  }catch(e){alert('Mine failed');}
}
async function watchBoost(){
  document.getElementById('status').innerText='Loading Ad...';
  try{
    if(!window.show) throw new Error('no ad');
    await window.show();
    await addDiamonds(2,'boost');
    document.getElementById('status').innerText='+2 💎 Boost! +20 Energy!';
  }catch(e){document.getElementById('status').innerText='No ad right now. Try again in 30 sec.';}
}
async function claimBonus(){await addDiamonds(5,'bonus');alert('+5 💎 Daily Bonus!');}
async function doClaim(){
  const wallet=document.getElementById('wallet').value.trim();
  if(!wallet) return alert('Enter wallet first');
  if(diamonds<2000) return alert('Min Withdraw 2000 💎. You have '+diamonds);
  const r=await fetch('/api/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId,username,wallet})});
  const d=await r.json();
  if(d.success){diamonds=0;updateUI();alert('Withdraw sent! '+d.xrp+' XRP');} else alert(d.error);
}
loadBalance();
setInterval(()=>{ if(energy < 100){ energy++; updateUI(); } }, 60000);
document.addEventListener('DOMContentLoaded',()=>{const s=document.createElement('script');s.src='https://wall.giga.pub/api/v1/loader.js?projectId=9127';s.async=true;document.head.appendChild(s);});
(window.loadGigaSDKCallbacks||(window.loadGigaSDKCallbacks=[])).push(()=>{window.loadOfferWallSDK({projectId:'9127'}).then(sdk=>{window.gigaOfferWallSDK=sdk;sdk.on('rewardClaim',async(data)=>{const ok=await addDiamonds(Number(data.amount||0),'offerwall',String(data.rewardId));if(ok){try{sdk.confirmReward(data.rewardId,data.hash);}catch(e){}alert('+'+data.amount+' 💎 Offer!');});}).catch(e=>console.log(e));});
function openOfferWall(){if(window.gigaOfferWallSDK)window.gigaOfferWallSDK.open();else alert('Offers loading... wait 5 sec');}
</script></body></html>
